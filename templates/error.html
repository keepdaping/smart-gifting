{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="container py-5 text-center" style="max-width: 640px;">
    <div class="empty-icon mx-auto mb-3"><i class="bi bi-exclamation-circle"></i></div>
    <p class="text-muted fw-semibold mb-2">Error {{ code }}</p>
    <h1 class="h2 mb-3">{{ title }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
        <i class="bi bi-house me-2"></i>Back to marketplace
    </a>
</section>
{% endblock %}
